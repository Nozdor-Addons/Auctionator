name: Send repo archive to Discord on push

on:
  push:
    branches: ["main"]
    # Эти файлы в архив не входят: правка только их - не новая версия для игроков.
    paths-ignore:
      - ".github/**"
      - "README.md"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: discord-zip-${{ github.ref }}
  cancel-in-progress: false

jobs:
  zip-and-send:
    runs-on: ubuntu-latest
    steps:
      - name: Check Discord webhook secret
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_AUCTIONATOR }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "::error::Secret DISCORD_WEBHOOK_AUCTIONATOR is not set (Settings > Secrets and variables > Actions)"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create ZIP from current commit (exclude .github and README.md)
        id: make_zip
        shell: bash
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          BRANCH="${GITHUB_REF_NAME}"
          SHORT_SHA="${GITHUB_SHA:0:7}"
          ZIP_NAME="${REPO_NAME}-${BRANCH}-${SHORT_SHA}.zip"

          git archive --format=zip -o "$ZIP_NAME" HEAD -- . ':(exclude).github' ':(exclude)README.md'

          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV

          size=$(stat -c%s "$ZIP_NAME")
          echo "size=$size" >> $GITHUB_OUTPUT
          if [ "$size" -lt 24000000 ]; then
            echo "small=true" >> $GITHUB_OUTPUT
          else
            echo "small=false" >> $GITHUB_OUTPUT
          fi

      - name: Build Discord message
        shell: bash
        env:
          # Текст коммитов - через окружение: кавычки и апострофы в нём не ломают скрипт.
          COMMIT_MESSAGES: ${{ toJson(github.event.commits.*.message) }}
          SMALL: ${{ steps.make_zip.outputs.small }}
        run: |
          # Ручной запуск (workflow_dispatch) приходит без списка коммитов - берём последний.
          HEAD_MESSAGE="$(git log -1 --format=%B)"

          # Большой архив уходит в релиз, в сообщении - ссылка на него.
          TAIL=""
          if [ "$SMALL" != "true" ]; then
            TAIL=$'\n\n'"Архив: https://github.com/${GITHUB_REPOSITORY}/releases/tag/auto-${GITHUB_REF_NAME}-${GITHUB_SHA}"
          fi

          # Discord принимает не больше 2000 символов: режем текст коммитов, ссылку не трогаем.
          jq -n \
            --arg repo "${GITHUB_REPOSITORY#*/}" \
            --argjson messages "${COMMIT_MESSAGES:-null}" \
            --arg head "$HEAD_MESSAGE" \
            --arg tail "$TAIL" '
            (($messages // []) | if length > 0 then . else [$head] end)
            | map(gsub("\r\n?"; "\n") | split("\n") | map(select(. != "")) | join("\n") | select(. != ""))
            | ($repo + "\n" + join("\n")) as $text
            | (2000 - ($tail | length)) as $room
            | {content: ((if ($text | length) > $room then $text[0:($room - 3)] + "..." else $text end) + $tail)}
          ' > payload.json

      - name: Send to Discord (attach)
        if: steps.make_zip.outputs.small == 'true'
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_AUCTIONATOR }}
        run: |
          curl -sS --fail-with-body -X POST \
            -F "payload_json=<payload.json" \
            -F "file=@${ZIP_NAME}" \
            "$WEBHOOK_URL"

      - name: Create GitHub release (fallback for big ZIP)
        id: create_release
        if: steps.make_zip.outputs.small != 'true'
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: auto-${{ github.ref_name }}-${{ github.sha }}
          release_name: Auto archive ${{ github.ref_name }} ${{ github.sha }}
          body: "Auto-archive for commit ${{ github.sha }} on ${{ github.ref_name }}"
          draft: false
          prerelease: false

      - name: Upload ZIP to release
        if: steps.make_zip.outputs.small != 'true'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ${{ env.ZIP_NAME }}
          asset_name: ${{ env.ZIP_NAME }}
          asset_content_type: application/zip

      - name: Notify Discord with release link
        if: steps.make_zip.outputs.small != 'true'
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_AUCTIONATOR }}
        run: |
          curl -sS --fail-with-body -H "Content-Type: application/json" \
            --data-binary @payload.json \
            "$WEBHOOK_URL"
